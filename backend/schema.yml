components:
  schemas:
    ActionEnum:
      enum:
      - CREATE
      - UPDATE
      - ACKNOWLEDGE
      type: string
      description: |-
        * `CREATE` - CREATE
        * `UPDATE` - UPDATE
        * `ACKNOWLEDGE` - ACKNOWLEDGE
    Alerta:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        pivo:
          type: string
          format: uuid
        pivo_codigo:
          type: string
          description: 'Identificador único na fazenda, ex: PIV-01'
          readOnly: true
        tipo:
          type: string
          maxLength: 60
        severidade:
          $ref: '#/components/schemas/SeveridadeEnum'
        severidade_display:
          type: string
          readOnly: true
        titulo:
          type: string
          maxLength: 150
        mensagem:
          type: string
        gerado_em:
          type: string
          format: date-time
          readOnly: true
        reconhecido_em:
          type: string
          format: date-time
          nullable: true
        reconhecido_por:
          type: integer
          nullable: true
        resolvido_em:
          type: string
          format: date-time
          nullable: true
      required:
      - gerado_em
      - id
      - mensagem
      - pivo
      - pivo_codigo
      - severidade_display
      - titulo
    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        tabela:
          type: string
          maxLength: 100
        entidade_id:
          type: string
          maxLength: 64
        acao:
          type: string
          maxLength: 20
        detalhes: {}
        usuario:
          type: integer
          nullable: true
        usuario_nome:
          type: string
          readOnly: true
        ip_address:
          type: string
          nullable: true
        criado_em:
          type: string
          format: date-time
          readOnly: true
      required:
      - acao
      - criado_em
      - entidade_id
      - id
      - tabela
      - usuario_nome
    Cultura:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        nome:
          type: string
          maxLength: 100
        variedade:
          type: string
          maxLength: 100
        dias_ciclo_estimado:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        coeficiente_kc_padrao:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
        criado_em:
          type: string
          format: date-time
          readOnly: true
      required:
      - criado_em
      - id
      - nome
    EntityEnum:
      enum:
      - pivo
      - registro_irrigacao
      - alerta
      type: string
      description: |-
        * `pivo` - pivo
        * `registro_irrigacao` - registro_irrigacao
        * `alerta` - alerta
    Fazenda:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        nome:
          type: string
          maxLength: 150
        codigo:
          type: string
          maxLength: 50
        municipio:
          type: string
          maxLength: 100
        uf:
          type: string
          maxLength: 2
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        area_total_ha:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        pivos_count:
          type: integer
          readOnly: true
        criado_em:
          type: string
          format: date-time
          readOnly: true
        atualizado_em:
          type: string
          format: date-time
          readOnly: true
      required:
      - atualizado_em
      - codigo
      - criado_em
      - id
      - municipio
      - nome
      - pivos_count
      - uf
    JanelaOportunidade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        pivo:
          type: string
          format: uuid
        pivo_codigo:
          type: string
          description: 'Identificador único na fazenda, ex: PIV-01'
          readOnly: true
        inicio_previsto:
          type: string
          format: date-time
        fim_previsto:
          type: string
          format: date-time
        motivo:
          type: string
          maxLength: 150
        tarifa_vigente:
          type: string
          maxLength: 50
        economia_estimada_reais:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        recomendacao:
          type: string
        aproveitada:
          type: boolean
      required:
      - fim_previsto
      - id
      - inicio_previsto
      - pivo
      - pivo_codigo
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    OrigemEnum:
