      - criado_em
      - id
      - inicio_em
      - operador_nome
      - pivo
      - pivo_codigo
    RoleEnum:
      enum:
      - ADMIN
      - GESTOR
      - OPERADOR
      - CONSULTOR
      type: string
      description: |-
        * `ADMIN` - Administrador do Sistema
        * `GESTOR` - Gestor Agrícola
        * `OPERADOR` - Operador de Campo
        * `CONSULTOR` - Auditor / Consulta
    Safra:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        nome:
          type: string
          maxLength: 100
        data_inicio:
          type: string
          format: date
        data_fim:
          type: string
          format: date
        ativa:
          type: boolean
      required:
      - data_fim
      - data_inicio
      - id
      - nome
    SentidoRotacaoEnum:
      enum:
      - HORARIO
      - ANTI_HORARIO
      - ESTACIONARIO
      type: string
      description: |-
        * `HORARIO` - Horário (Sentido dos Ponteiros)
        * `ANTI_HORARIO` - Anti-Horário
        * `ESTACIONARIO` - Estacionário
    SeveridadeEnum:
      enum:
      - INFO
      - ATENCAO
      - CRITICO
      type: string
      description: |-
        * `INFO` - Informativo
        * `ATENCAO` - Atenção Operacional
        * `CRITICO` - Crítico / Parada de Emergência
    SingleSyncOperation:
      type: object
      properties:
        client_op_id:
          type: string
          format: uuid
        entity:
          $ref: '#/components/schemas/EntityEnum'
        action:
          $ref: '#/components/schemas/ActionEnum'
        occurred_at:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: {}
      required:
      - action
      - client_op_id
      - entity
      - occurred_at
      - payload
    StatusEnum:
      enum:
      - PLANEJADO
      - EM_ANDAMENTO
      - CONCLUIDO
      - CANCELADO
      type: string
      description: |-
        * `PLANEJADO` - Planejado
        * `EM_ANDAMENTO` - Em Andamento
        * `CONCLUIDO` - Concluído
        * `CANCELADO` - Cancelado
    StatusOperacionalEnum:
      enum:
      - PARADO
      - IRRIGANDO
      - FERTIRRIGANDO
      - MANUTENCAO
      - FALHA
      type: string
      description: |-
        * `PARADO` - Parado / Desligado
        * `IRRIGANDO` - Irrigando com Água
        * `FERTIRRIGANDO` - Fertirrigação Ativa
        * `MANUTENCAO` - Em Manutenção
        * `FALHA` - Falha Operacional / Interrompido
    SyncPushBatch:
      type: object
      properties:
        client_device_id:
          type: string
          default: MOBILE_UNKNOWN
          maxLength: 100
        batch_timestamp:
          type: string
          format: date-time
        operations:
          type: array
          items:
            $ref: '#/components/schemas/SingleSyncOperation'
      required:
      - operations
    Talhao:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        fazenda:
          type: string
          format: uuid
        fazenda_nome:
          type: string
          readOnly: true
        codigo:
          type: string
          maxLength: 50
        nome:
          type: string
          maxLength: 100
        area_ha:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        criado_em:
          type: string
          format: date-time
          readOnly: true
      required:
      - area_ha
      - codigo
      - criado_em
      - fazenda
      - fazenda_nome
      - id
      - nome
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          title: Usuário
          description: Obrigatório. 150 caracteres ou menos. Letras, números e @/./+/-/_
            apenas.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          title: Endereço de email
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        first_name:
          type: string
          title: Primeiro nome
          maxLength: 150
        last_name:
          type: string
          title: Último nome
          maxLength: 150
        is_staff:
          type: boolean
          title: Membro da equipe
          description: Indica que usuário consegue acessar este site de administração.
        profile:
          allOf:
          - $ref: '#/components/schemas/UserProfile'
          readOnly: true
      required:
      - id
      - profile
      - username
    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        role:
          $ref: '#/components/schemas/RoleEnum'
        telefone:
          type: string
          maxLength: 30
        departamento:
          type: string
          maxLength: 100
        ativo:
          type: boolean
      required:
      - id
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
