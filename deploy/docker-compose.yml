version: '3.8'

services:
  backend:
    build:
      context: ../
      dockerfile: deploy/Dockerfile.backend
    container_name: cockpit_backend
    restart: always
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY deve ser informada no arquivo .env}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,cockpit.fazenda.local}
      - DB_ENGINE=${DB_ENGINE:-mssql}
      - DB_NAME=${DB_NAME:-CockpitPivosDB}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST:-sqlserver_host}
      - DB_PORT=${DB_PORT:-1433}
      - DB_ODBC_DRIVER=${DB_ODBC_DRIVER:-ODBC Driver 18 for SQL Server}
      - DB_TRUST_SERVER_CERTIFICATE=${DB_TRUST_SERVER_CERTIFICATE:-yes}
    volumes:
      - ../backend/staticfiles:/app/staticfiles
      - ../backend/db.sqlite3:/app/db.sqlite3 # Apenas caso use fallback sqlite
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: cockpit_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../backend/staticfiles:/var/www/static:ro
      - ../.output/public:/var/www/html:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
